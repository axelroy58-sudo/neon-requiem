<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NÉON REQUIEM — JDR solo cyberpunk</title>
<style>
:root{color-scheme:dark;--bg:#07080f;--p:#101222;--p2:#191d36;--tx:#dfe6ff;--mu:#8089b3;--c:#00f0ff;--m:#ff2a8a;--y:#ffe14d;--g:#39ff88;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
h1{font:700 22px "Courier New",monospace;letter-spacing:3px;color:var(--c);text-shadow:0 0 10px var(--c);margin:0}
header{padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header small{color:var(--y);font-family:monospace}
nav{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
nav button{flex:0 0 auto;background:var(--p);color:var(--mu);border:1px solid var(--p2);padding:8px 12px;border-radius:6px;font:600 13px monospace;cursor:pointer}
nav button.on{color:var(--c);border-color:var(--c);box-shadow:0 0 8px #00f0ff55}
main{padding:0 14px 40px;max-width:820px;margin:auto}
.card{background:var(--p);border:1px solid var(--p2);border-radius:8px;padding:12px;margin-bottom:10px}
.card.sel{border-color:var(--g);box-shadow:0 0 8px #39ff8855}
.card h3{margin:0 0 4px;font-size:15px;color:var(--y)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}
input,textarea{width:100%;background:#0d0f1e;color:var(--tx);border:1px solid var(--p2);border-radius:6px;padding:8px;font:inherit}
textarea{min-height:110px;resize:vertical}
.btn{background:transparent;color:var(--c);border:1px solid var(--c);padding:6px 11px;border-radius:6px;cursor:pointer;font:600 13px monospace}
.btn.m{color:var(--m);border-color:var(--m)}.btn.g{color:var(--g);border-color:var(--g)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.bar{height:10px;background:#0d0f1e;border-radius:5px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat{text-align:center;margin:0}.stat b{font:700 24px monospace;color:var(--c)}
.tag{display:inline-block;font:11px monospace;padding:1px 6px;border:1px solid var(--m);color:var(--m);border-radius:4px;margin-right:4px}
.eb{color:var(--y);font-family:monospace;font-weight:700}
h2{font:700 15px monospace;color:var(--m);letter-spacing:2px;margin:16px 0 8px}
.log{height:52vh;min-height:280px;overflow-y:auto;background:#0d0f1e;border:1px solid var(--p2);border-radius:8px;padding:10px;margin-bottom:8px}
.b{margin:0 0 10px;padding:9px 11px;border-radius:8px;white-space:pre-wrap;line-height:1.5}
.b.mj{background:var(--p2);border-left:3px solid var(--c)}
.b.me{background:#2a1230;border-left:3px solid var(--m);margin-left:18px}
.b.sys{color:var(--mu);font-size:12px;text-align:center}
.im{width:100%;border-radius:6px;margin-bottom:8px;display:block;background:#0d0f1e}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:20;background:var(--p2);color:var(--c);border:1px solid var(--c);border-radius:8px;padding:10px 14px;font:600 13px monospace;box-shadow:0 0 14px #00f0ff66;transition:transform .35s;max-width:92vw;cursor:pointer}
#toast.show{transform:translate(-50%,0)}
.en{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--p);color:var(--tx);border:1px solid var(--p2);border-radius:8px;padding:8px;margin-bottom:8px;cursor:pointer;font:inherit}
.en img,.en .th{width:72px;height:50px;border-radius:5px;object-fit:cover;background:#0d0f1e;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--p);color:var(--tx);border:1px solid var(--p2);border-radius:10px;padding:16px 8px;cursor:pointer;font:600 14px monospace}
</style></head><body>
<header><h1>NÉON REQUIEM</h1><small id="top"></small></header>
<button id="toast" data-t="cx"></button>
<nav id="nav"></nav><main id="app"></main>
<script>
const CY=[
["lames","Lames rétractables","Bras",1500,8,"Lames mono-moléculaires dans les avant-bras. Corps à corps +2 dégâts."],
["oeil","Œil cybernétique Zeiss","Tête",1200,5,"Zoom, vision thermique et nocturne, scan des visages."],
["reflex","Réflexes câblés Sandevistan","Système nerveux",4000,15,"Ralentit le temps quelques secondes. Initiative +3."],
["deck","Interface neurale (cyberdeck)","Crâne",2500,10,"Permet le piratage des caméras, portes et drones."],
["peau","Peau sous-dermique blindée","Corps",2000,10,"Armure +2 permanente."],
["jambes","Jambes à vérins","Jambes",1800,8,"Sauts de 5 m, athlétisme +2."],
["main","Main-gorille","Bras",1600,7,"Force brute +2, désarme au contact."],
["gland","Glandes de soins nanites","Organes",3000,9,"Récupère 2 PV par tour en combat."],
["voix","Modulateur vocal","Gorge",900,4,"Imite les voix entendues. Social +1."],
["memoire","Puce mémoire tactique","Crâne",1100,5,"Revoir une scène à la perfection, indices +2."]];
const AR=[
["pistol","Pistolet Militech M-10","Arme",500,"2d6","Fiable, discret, 12 balles."],
["smg","SMG Arasaka Kenshin","Arme",1100,"3d6","Rafale, bruyant, 30 balles."],
["shotgun","Fusil à pompe Tsunami","Arme",1400,"4d6","Portée courte, dévastateur."],
["sniper","Fusil de précision Nova","Arme",2600,"4d6","Longue portée, tir unique."],
["katana","Katana monofilament","Arme",1900,"3d6","Silencieux, ignore une partie de l’armure."],
["batte","Batte à clous","Arme",150,"1d6+1","Le style de la rue."],
["taser","Pistolet paralysant","Arme",350,"Étourdit","Non létal, 3 charges."],
["grenade","Grenade EMP","Objet",300,"Zone","Grille drones et cybernétique."],
["stim","Stimpack","Objet",120,"+10 PV","Soin instantané."],
["gilet","Gilet en kevlar","Armure",800,"+3 arm.","Léger, discret sous un manteau."],
["hack","Kit de piratage","Objet",400,"Tech","Bonus de piratage hors réseau."],
["fake","Fausse ID corpo","Objet",700,"Social","Ouvre des portes, une seule fois."]];
const CL=[
["solo","Solo","Mercenaire d’élite. Le feu et l’acier règlent tout.",{FOR:2,REF:2,COOL:1},2500,["peau"],["pistol","stim"]],
["net","Netrunner","Pirate du Net. Les murs numériques s’ouvrent pour toi.",{INT:2,TECH:2,REF:1},2000,["deck"],["hack","taser"]],
["fix","Fixer","Contacts, deals et magouilles. Tout se négocie.",{CHA:2,COOL:2,INT:1},5000,["voix"],["fake","pistol"]],
["tech","Techie","Bricoleur de génie. Tu répares, tu piéges, tu fabriques.",{TECH:2,INT:2,FOR:1},3000,["oeil"],["hack","grenade"]],
["med","Médtech","Docteur de la rue. Les nanites sont tes alliées.",{TECH:2,INT:2,COOL:1},2500,["gland"],["stim","stim","stim"]]];
const ST=["FOR","REF","TECH","INT","COOL","CHA"];
const DEF={nom:"",role:"",cls:"",bg:"",stats:{FOR:3,REF:3,TECH:3,INT:3,COOL:3,CHA:3},free:0,pv:35,stress:0,hum:100,eb:0,cy:[],inv:[],eq:[],note:"",memo:"",gid:"",codex:[],style:"cine"};
let S=Object.assign({},DEF),SL={},tab="play",msg="",msgs=[],turn=0,busy=false,db=null,uid=null,cloud="",draft="",cxf=[],tt=0,rst=false;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem("nr")||"{}"));SL=JSON.parse(localStorage.getItem("nr_sl")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("nr",JSON.stringify(S));localStorage.setItem("nr_sl",JSON.stringify(SL))}catch(e){}};
const maxpv=()=>20+S.stats.FOR*5;
const nm=(id,L)=>{const x=L.find(a=>a[0]==id);return x?x[1]:id};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const bar=(v,max,col)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,v/max*100))}%;background:${col}"></i></div>`;
const TABS=[["play","Jouer"],["cx","Codex"],["cl","Classe"],["fiche","Fiche"],["cat","Catalogue"],["sv","Sauvegardes"],["mj","Lancer / MAJ MJ"]];
function pick(id){
 const c=CL.find(x=>x[0]==id);
 S.cls=id;S.role=c[1];S.stats=Object.assign({},DEF.stats);
 for(const k in c[3])S.stats[k]+=c[3][k];
 S.free=4;S.cy=[...c[5]];S.inv=[...c[6]];S.eq=[];S.eb=c[4];S.stress=0;
 S.hum=100-S.cy.reduce((a,i)=>a+CY.find(x=>x[0]==i)[4],0);S.pv=maxpv();
}
function etat(){
 return `FICHE DU PERSONNAGE\nNom : ${S.nom||"?"} | Classe : ${S.role||"?"}\nStats : ${ST.map(k=>k+" "+S.stats[k]).join(", ")}\nPV : ${S.pv}/${maxpv()} | Stress : ${S.stress}/10 | Humanité : ${S.hum}%\nArgent : ${S.eb} ¥\nCyberware : ${S.cy.map(i=>nm(i,CY)).join(", ")||"aucun"}\nInventaire : ${S.inv.map((id,n)=>nm(id,AR)+(S.eq.includes(n)?" (équipé)":"")).join(", ")||"vide"}\nPassé : ${S.bg||"à inventer ensemble"}\nNotes : ${S.note||"aucune"}`}
function maj(t){
 try{const o=JSON.parse(t.match(/\{[\s\S]*\}/)[0]);const n=(v,a,b)=>Math.max(a,Math.min(b,Math.round(+v)));
  if("pv" in o)S.pv=n(o.pv,0,maxpv());if("st" in o)S.stress=n(o.st,0,10);if("hum" in o)S.hum=n(o.hum,0,100);if("eb" in o)S.eb=n(o.eb,0,1e9);
  if(Array.isArray(o.cy))S.cy=o.cy.map(String);
  if(Array.isArray(o.inv)){S.inv=o.inv.map(String);S.eq=(Array.isArray(o.eq)?o.eq:S.eq).filter(i=>i>=0&&i<S.inv.length)}
  if(typeof o.note==="string")S.note=o.note;if(typeof o.memo==="string")S.memo=o.memo.slice(0,900);
  if(Array.isArray(o.codex)){const L=[...(S.codex||[])];for(const e of o.codex){if(!e||!e.n||!["pnj","zone","corpo","moment"].includes(e.t))continue;const nz=String(e.n).slice(0,60),i=L.findIndex(x=>x.t==e.t&&x.n.toLowerCase()==nz.toLowerCase()),d=String(e.d||"").slice(0,700),s=String(e.s||"").slice(0,70);if(i>=0){L[i]=Object.assign({},L[i],{d:d||L[i].d,s:s||L[i].s||"",nw:1});cxf.push(L[i].n)}else{L.push({id:Date.now().toString(36)+L.length,t:e.t,n:nz,s,d,tour:turn+1,img:"",nw:1});cxf.push(nz)}}S.codex=L.slice(-80)}
  return "Fiche mise à jour."}catch(e){return "Format non reconnu."}}
function render(){
 S.pv=Math.min(S.pv,maxpv());
 document.getElementById("top").textContent=S.eb+" ¥ | PV "+S.pv+" | HUM "+S.hum+"%";
 document.getElementById("nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${tab==t[0]?"on":""}">${t[1]}${t[0]=="cx"&&nwN()?` <b style="color:var(--m)">● ${nwN()}</b>`:""}</button>`).join("");
 let h="";
 if(tab=="cl"){
  h+=`<h2>CHOISIS TA CLASSE</h2><div class="mu" style="margin-bottom:8px">Attention : choisir une classe lance une nouvelle histoire.</div><div class="card"><div class="mu" style="margin-bottom:8px">Tout effacer et repartir de zéro :</div>${rstBtn()}</div>`+CL.map(c=>`<div class="card ${S.cls==c[0]?"sel":""}"><div class="row"><h3>${c[1]}</h3><span class="eb">${c[4]} ¥</span></div><div class="mu">${c[2]}</div><div style="margin:6px 0">${Object.keys(c[3]).map(k=>`<span class="tag">${k} +${c[3][k]}</span>`).join("")}</div><div class="mu">Départ : ${c[5].map(i=>nm(i,CY)).join(", ")} · ${c[6].map(i=>nm(i,AR)).join(", ")}</div><div style="margin-top:8px"><button class="btn g" data-k="${c[0]}">${S.cls==c[0]?"Recommencer":"Choisir"}</button></div></div>`).join("");
 }
 if(tab=="fiche"){
  if(!S.cls)h+=`<div class="card">Choisis d’abord une classe dans l’onglet Classe.</div>`;
  else{
  h+=`<div class="card"><input id="nom" placeholder="Nom / alias" value="${esc(S.nom)}"><div style="height:8px"></div><textarea id="bg" placeholder="Passé, motivations, ennemis…">${esc(S.bg)}</textarea><div class="mu" style="margin-top:6px">Classe : <b>${esc(S.role)}</b></div></div>`;
  h+=`<div class="card"><div class="row"><b>Stats</b><span class="eb">${S.free} pts libres</span></div><div class="grid" style="margin-top:8px">`+ST.map(k=>`<div class="stat card"><div class="mu">${k}</div><b>${S.stats[k]}</b><div class="row" style="justify-content:center"><button class="btn m" data-s="${k}" data-d="-1">−</button><button class="btn" data-s="${k}" data-d="1" ${S.free<1||S.stats[k]>=8?"disabled":""}>+</button></div></div>`).join("")+`</div></div>`;
  h+=`<div class="card"><div class="row"><b>Points de vie</b><span>${S.pv}/${maxpv()}</span></div>${bar(S.pv,maxpv(),"var(--g)")}<div class="row"><b>Stress</b><span>${S.stress}/10</span></div>${bar(S.stress,10,"var(--m)")}<div class="row"><b>Humanité</b><span>${S.hum}%</span></div>${bar(S.hum,100,"var(--c)")}<div class="mu">${S.hum<30?"Cyberpsychose imminente…":"Tu es encore toi-même."}</div><div class="row" style="margin-top:10px"><b>Eurodollars</b><span class="eb">${S.eb} ¥</span></div></div>`;
  h+=`<h2>CYBERWARE</h2>`+(S.cy.length?S.cy.map(i=>{const c=CY.find(x=>x[0]==i);return `<div class="card"><h3>${c?c[1]:esc(i)}</h3><div class="mu">${c?c[5]:""}</div></div>`}).join(""):`<div class="mu">Aucun implant.</div>`);
  h+=`<h2>INVENTAIRE</h2>`+(S.inv.length?S.inv.map((id,n)=>{const a=AR.find(x=>x[0]==id);const e=S.eq.includes(n);return `<div class="card ${e?"sel":""}"><div class="row"><h3>${a?a[1]:esc(id)}</h3>${a?`<span class="tag">${a[4]}</span>`:""}</div><button class="btn g" data-q="${n}">${e?"Équipé ✓":"Équiper"}</button></div>`}).join(""):`<div class="mu">Vide.</div>`);
  h+=`<h2>NOTES</h2><textarea id="note" placeholder="Notes…">${esc(S.note)}</textarea>`;}
 }
 if(tab=="cat"){
  h+=`<h2>CATALOGUE DU MARCHÉ</h2><h2>IMPLANTS</h2>`+CY.map(c=>`<div class="card"><div class="row"><h3>${c[1]}</h3><span class="eb">${c[3]} ¥</span></div><span class="tag">${c[2]}</span><span class="tag">−${c[4]} HUM</span><div class="mu" style="margin-top:6px">${c[5]}</div></div>`).join("")+`<h2>ARMES &amp; OBJETS</h2>`+AR.map(a=>`<div class="card"><div class="row"><h3>${a[1]}</h3><span class="eb">${a[3]} ¥</span></div><span class="tag">${a[2]}</span><span class="tag">${a[4]}</span><div class="mu" style="margin-top:6px">${a[5]}</div></div>`).join("");
 }
 if(tab=="sv"){
  h+=`<h2>SAUVEGARDES</h2>`+[1,2,3].map(n=>{const s=SL[n];return `<div class="card"><div class="row"><b>Slot ${n}</b><span class="mu">${s?esc(s.nom||"Sans nom")+" · "+esc(s.role)+" · "+s.eb+" ¥":"vide"}</span></div><div class="row" style="margin-top:8px;justify-content:flex-start"><button class="btn g" data-sv="${n}">Sauver</button><button class="btn" data-ld="${n}" ${s?"":"disabled"}>Charger</button><button class="btn m" data-dl="${n}" ${s?"":"disabled"}>Effacer</button></div></div>`}).join("");
 }
 if(tab=="mj"){
  const cat=CY.map(c=>`${c[0]} = ${c[1]} (${c[3]} ¥, −${c[4]} humanité)`).join("\n")+"\n"+AR.map(a=>`${a[0]} = ${a[1]} (${a[3]} ¥)`).join("\n");
  const p=`Tu es le MJ d’un JDR solo cyberpunk dans Néon Requiem. Ton sombre, néons, corpos.\nCATALOGUE\n${cat}\n`+etat()+"\nCommence l’aventure.";
  h+=`<h2>1. LANCER LA PARTIE</h2><div class="card"><textarea id="out" readonly style="min-height:180px">${esc(p)}</textarea><div style="height:8px"></div><button class="btn g" data-copy="1">Copier</button> <span id="ok" class="mu"></span></div>`;
  h+=`<h2>2. METTRE À JOUR MA FICHE</h2><div class="card"><textarea id="maj" placeholder='{"pv":30,"st":2,"hum":88,"eb":4200}'></textarea><div style="height:8px"></div><button class="btn" data-ap="1">Appliquer</button><div class="mu" style="margin-top:6px">${esc(msg)}</div></div>`;
 }
 if(tab=="play")h=playTab();if(tab=="cx")h=cxView();document.getElementById("app").innerHTML=h;if(tab=="play"){const l=document.getElementById("log");if(l)l.scrollTop=l.scrollHeight}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.t){tab=d.t;msg="";rst=false}
 else if(d.k){pick(d.k);S.gid=Date.now().toString(36);S.codex=[];msgs=[];turn=0;draft="";tab="play"}
 else if(d.send){send(d.send=="start");return}
 else if(d.il){illus2(d.il);return}
 else if(d.cc){cxCat=d.cc;cxSel=""}
 else if(d.ce){cxSel=d.ce;S.codex=(S.codex||[]).map(y=>y.id==d.ce&&y.nw?Object.assign({},y,{nw:0}):y);save()}
 else if(d.cb){cxSel="";if(d.cb=="home")cxCat=""}
 else if(d.rs){if(d.rs=="ask")rst=true;else if(d.rs=="no")rst=false;else resetAll()}
 else if(d.up){upl(d.up);return}
 else if(d.rm){S.codex=(S.codex||[]).filter(x=>x.id!=d.rm);cxSel="";save()}
 else if(d.cxadd){const nme=document.getElementById("cxn").value.trim();if(!nme)return;S.codex=[...(S.codex||[]),{id:Date.now().toString(36),t:document.getElementById("cxt").value,n:nme,d:document.getElementById("cxd").value,tour:turn,img:""}];save()}
 else if(d.s){const k=d.s,v=+d.d;if(v>0&&S.free>0&&S.stats[k]<8){S.stats[k]++;S.free--}else if(v<0&&S.stats[k]>1){S.stats[k]--;S.free++}}
 else if(d.q!==undefined){const n=+d.q,i=S.eq.indexOf(n);i<0?S.eq.push(n):S.eq.splice(i,1)}
 else if(d.sv){SL[d.sv]=JSON.parse(JSON.stringify(S))}
 else if(d.ld){S=Object.assign({},DEF,SL[d.ld])}
 else if(d.dl){delete SL[d.dl]}
 else if(d.ap){msg=maj(document.getElementById("maj").value)}
 else if(d.copy){const t=document.getElementById("out");t.select();try{navigator.clipboard.writeText(t.value);document.getElementById("ok").textContent="Copié !"}catch(_){}}
 else return;
 save();render()});
document.addEventListener("input",e=>{const i=e.target.id;if(["nom","bg","note"].includes(i)){S[i]=e.target.value;save()}});
function playTab(){
 if(!S.cls)return `<div class="card">Choisis d’abord une classe dans l’onglet Classe.</div>`;
 const hud=`<div class="card"><div class="row"><span>PV ${S.pv}/${maxpv()}</span><span>Stress ${S.stress}/10</span><span>HUM ${S.hum}%</span><span class="eb">${S.eb} ¥</span></div></div><div class="row" style="justify-content:flex-start;margin-bottom:8px">${rstBtn()}</div>`;
 const log=msgs.map(m=>`<div class="b ${m.r=="a"?"mj":"me"}">${esc(m.t)}</div>`).join("")||`<div class="b sys">Prêt à plonger dans Néon Requiem ?</div>`;
 return hud+`<div class="log" id="log">${log}</div>`+(msgs.length?`<textarea id="inp" placeholder="Que fais-tu ?" style="min-height:70px">${esc(draft)}</textarea><div class="row" style="margin-top:8px"><button class="btn g" data-send="1">Envoyer</button></div>`:`<button class="btn g" data-send="start">Lancer l’aventure</button>`);
}
function send(start){
 const txt=start?"":(document.getElementById("inp")?.value.trim()||draft.trim());
 if(!start&&!txt)return;
 draft="";
 if(!start)msgs.push({r:"u",t:txt});
 msgs.push({r:"a",t:"[Simulation IA active] Les néons de la ville clignotent dans la nuit pluvieuse...\n\n1. Enquêter dans les bas-fonds.\n2. Pirater le terminal de la corpo.\n3. Aller voir ton fixer.\n\n```json\n{\"pv\":"+S.pv+",\"st\":"+S.stress+",\"hum\":"+S.hum+",\"eb\":"+S.eb+",\"cy\":[],\"inv\":[],\"eq\":[]}\n```"});
 turn++;render();
}
function resetAll(){S=JSON.parse(JSON.stringify(DEF));msgs=[];turn=0;tab="cl";render();}
const rstBtn=()=>rst?`<button class="btn m" data-rs="go">Confirmer</button> <button class="btn" data-rs="no">Annuler</button>`:`<button class="btn m" data-rs="ask">Nouvelle partie</button>`;
let cxCat="",cxSel="";
const CAT=[["pnj","Personnages","👤"],["zone","Zones","🏙️"],["corpo","Corpos","🏢"],["moment","Événements","📜"]];
const STY=[["cine","Cinématique Réaliste / Noir"],["neon","Néon Brutaliste"],["cyberpunk","Cyberpunk 2077 Rendu HD"]];
function cxView(){
 const C=S.codex||[];
 const x=cxSel?C.find(y=>y.id==cxSel):null;
 if(x){
  const ct=CAT.find(c=>c[0]==x.t)||CAT[0];
  return `<button class="btn" data-cb="cat">← ${ct[1]}</button><div class="card" style="margin-top:8px">${IMG[x.id]?`<img class="im" src="${IMG[x.id]}">`:`<div class="im" style="height:140px;display:flex;align-items:center;justify-content:center;font-size:48px">${ct[2]}</div>`}<h3 style="font-size:19px;margin:6px 0 2px">${esc(x.n)}</h3><div style="white-space:pre-wrap;line-height:1.55;margin-bottom:10px">${esc(x.d)}</div></div><div class="card"><button class="btn" data-il="${x.id}">Générer illustration réaliste</button> <button class="btn m" data-rm="${x.id}">Supprimer</button></div>`;
 }
 if(cxCat){
  const ct=CAT.find(c=>c[0]==cxCat)||CAT[0];
  const L=C.filter(y=>y.t==cxCat);
  return `<button class="btn" data-cb="home">← Codex</button><h2>${ct[2]} ${ct[1].toUpperCase()}</h2>`+(L.length?L.map(y=>`<button class="en" data-ce="${y.id}"><span class="th">${ct[2]}</span><span style="flex:1"><b>${esc(y.n)}</b></span></button>`).join(""):`<div class="mu">Vide.</div>`);
 }
 return `<div class="mu" style="margin-bottom:10px">Choisis une catégorie :</div><div class="grid" style="grid-template-columns:1fr 1fr">`+CAT.map(c=>`<button class="tile" data-cc="${c[0]}"><span style="font-size:30px">${c[2]}</span>${c[1]}</button>`).join("")+`</div>`;
}
let IMG={};
function illus2(id){
 const e=(S.codex||[]).find(x=>x.id==id);if(!e)return;
 const svg = `<svg viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#020308"/><stop offset="60%" stop-color="#0d0f1e"/><stop offset="100%" stop-color="#1f0924"/></linearGradient><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#ff2a8a"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#sky)"/><polygon points="50,350 50,150 120,90 120,350" fill="#080a14"/><polygon points="100,350 100,80 180,40 180,350" fill="#05070e"/><polygon points="420,350 420,110 520,70 520,350" fill="#060811"/><line x1="0" y1="280" x2="600" y2="280" stroke="#ff2a8a" stroke-width="3" stroke-opacity="0.6"/><path d="M 150,220 Q 300,180 450,230" fill="none" stroke="url(#neon)" stroke-width="4"/><circle cx="300" cy="100" r="3" fill="#ffe14d"/><text x="300" y="320" fill="#dfe6ff" font-family="monospace" font-size="15" text-anchor="middle" letter-spacing="4">${e.n.toUpperCase()}</text></svg>`;
 IMG[id]="data:image/svg+xml;utf8,"+encodeURIComponent(svg);
 save();render();
}
